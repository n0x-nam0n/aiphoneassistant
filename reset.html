<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Choose your password — Hostess</title>
  <link rel="stylesheet" href="desk.css">
  <style>[hidden]{display:none!important}.reset-page{max-width:460px;margin:8vh auto;padding:24px}.reset-page h1{margin-bottom:20px}.reset-page .login-card{width:100%}</style>
</head>
<body>
  <main class="reset-page">
    <h1>Choose your new password</h1>
    <p>Set the password you’ll use to sign in to your Hostess restaurant desk.</p>
    <form id="password-form" class="login-card">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmation">Confirm new password</label>
      <input id="confirmation" type="password" autocomplete="new-password" minlength="12" required>
      <button id="save-password" class="primary-button" type="submit">Save password</button>
      <p id="reset-status" class="form-message" role="status" aria-live="polite">Use at least 12 characters.</p>
    </form>
    <p id="reset-success" hidden>Your password is saved. <a href="desk.html">Sign in to your restaurant desk</a>.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="reset.js?v=1"></script>
</body>
</html>
